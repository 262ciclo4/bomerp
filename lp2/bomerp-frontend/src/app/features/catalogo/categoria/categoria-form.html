<form [formGroup]="form" (ngSubmit)="guardar()">
  @if (loading()) {
    <p>Cargando...</p>
  }

  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput type="text" formControlName="nombre" />
  </mat-form-field>
  @if (mensajeValidacion('nombre'); as mensaje) {
    <p class="error">{{ mensaje }}</p>
  }

  <mat-form-field>
    <mat-label>Descripción</mat-label>
    <textarea matInput formControlName="descripcion"></textarea>
  </mat-form-field>
  @if (mensajeValidacion('descripcion'); as mensaje) {
    <p class="error">{{ mensaje }}</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="acciones">
    <button matButton="filled" type="submit" [disabled]="loading() || errorCarga()">
      Guardar
    </button>
    <button matButton type="button" (click)="cancelar()">Cancelar</button>
  </div>
</form>

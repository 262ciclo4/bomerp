name: bomerp-backend-dev

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: bomerp-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: 123456
      APP_USER: BOMERP_APP
      APP_USER_PASSWORD: 123456
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  seguridad-db:
    image: postgres:17-alpine
    container_name: bomerp-seguridad-db
    restart: unless-stopped
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: bomerp_seguridad
      POSTGRES_USER: bomerp_seguridad
      POSTGRES_PASSWORD: 123456
    volumes:
      - seguridad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bomerp_seguridad -d bomerp_seguridad"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  oracle-data:
  seguridad-db-data:

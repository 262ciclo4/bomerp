server:
  port: 8080

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: BOMERP_APP
    password: 123456
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

bomerp:
  datasource:
    seguridad:
      url: jdbc:postgresql://localhost:5431/bomerp_seguridad
      username: bomerp_seguridad
      password: 123456
      driver-class-name: org.postgresql.Driver
  cors:
    allowed-origins: http://localhost:4200,http://localhost:5173,http://localhost:5174

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.bomerp: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always


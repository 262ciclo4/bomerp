site_name: BOM ERP
site_description: Entorno integrado de desarrollo academico para construir modulos ERP con ADS, BD2 y LP2.
site_author: UPeU
copyright: Angel Sullon @asullom - UPeU 2026
repo_url: https://github.com/262ciclo4/bomerp
repo_name: 262ciclo4/bomerp
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Guía del Proyecto Integrador:
      - Alineamiento: proyecto-integrador/index.md
      - 1. Diseño técnico, motor transaccional y backend inicial:
          - Producto integrado U1: proyecto-integrador/u1/index.md
          - ADS Producto U1: proyecto-integrador/u1/ads-producto.md
          - BD2 Producto U1: proyecto-integrador/u1/bd2-producto.md
          - LP2 Demo U1: proyecto-integrador/u1/lp2-demo.md
      - 2. Modelado UML, administración Oracle y SPA segura:
          - Producto integrado U2: proyecto-integrador/u2/index.md
          - ADS Producto U2: proyecto-integrador/u2/ads-producto.md
          - BD2 Producto U2: proyecto-integrador/u2/bd2-producto.md
          - LP2 Demo U2: proyecto-integrador/u2/lp2-demo.md
      - 3. Diseño consolidado, operación Oracle y Full-Stack integrado:
          - Producto integrado U3: proyecto-integrador/u3/index.md
          - ADS Producto U3: proyecto-integrador/u3/ads-producto.md
          - BD2 Producto U3: proyecto-integrador/u3/bd2-producto.md
          - LP2 Producto U3: proyecto-integrador/u3/lp2-producto.md
          - Checklist final: proyecto-integrador/u3/checklist-final.md
          - Guía de sustentación: proyecto-integrador/u3/guia-sustentacion.md
  - ADS:
      - Inicio: ads/index.md
      - Plan de trabajo: ads/plan-trabajo.md
      - Silabos:
          - Silabo 2026-1: ads/silabo_ads_2026_1.md
          - Silabo 2026-2: ads/silabo_ads_2026_2.md
      - 1. Arquitectura y Diseño Estructural:
          - S1 - Fundamentos de arquitectura de software: ads/sesiones/S01_Fundamentos_Arquitectura_Software.md
  - BD2:
      - Inicio: bd2/index.md
      - Plan de trabajo: bd2/plan-trabajo.md
      - Silabos:
          - Silabo 2026-1: bd2/silabo_bd2_2026_1.md
          - Silabo 2026-2: bd2/silabo_bd2_2026_2.md
      - 1. Programación y optimización (Oracle XE):
          - S1 - PL/SQL aplicado al negocio: bd2/sesiones/S01_PLSQL_Aplicado_Negocio.md
  - LP2:
      - Inicio: lp2/index.md
      - Plan de trabajo: lp2/plan-trabajo.md
      - Silabos:
          - Silabo 2026-1: lp2/silabo_lp2_2026_1.md
          - Silabo 2026-2: lp2/silabo_lp2_2026_2.md
      - Decisiones de arquitectura:
          - ADR-001 - Arquitectura del backend: lp2/adr/ADR-001-arquitectura-backend.md
          - ADR-002 - Spring Modulith: lp2/adr/ADR-002-spring-modulith.md
          - ADR-003 - Versión exacta de Spring Boot 4.0.7: lp2/adr/ADR-003-spring-boot-4.md
      - 1. Base backend REST modular de BomERP:
          - S1 - Arquitectura backend REST profesional: lp2/sesiones/S01_Arquitectura_Backend_REST_Profesional.md
